<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Dice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <section class="player player-1">
            <h1>PLAYER 1</h1>

            <p class="score">43</p>

            <div class="current">
                <span>CURRENT</span>
                <br>
                <span>0</span>
            </div>
        </section>


        
        <section class="player player-2">
            <h1>PLAYER 2</h1>

            <p class="score">24</p>

            <div class="current">
                <span>CURRENT</span>
                <br>
                <span>0</span>
            </div>
        </section>


        <div class="controls">

            <button class="new-game">
                NEW GAME
            </button>

            <div class="dice">
                <img style="height: 50px;" src="dice.png" alt="dice">
            </div>

            <button class="btn">
                 ROLL DICE
            </button>

            <button class="btn">
                 HOLD
            </button>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
